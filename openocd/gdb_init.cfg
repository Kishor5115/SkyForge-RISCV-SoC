# ──────────────────────────────────────────────────────────────────
# GDB Init Script for PicoRV32 SoC Debug
# Usage: riscv64-unknown-elf-gdb -x gdb_init.cfg firmware.elf
# ──────────────────────────────────────────────────────────────────

# Connect to OpenOCD
set remotetimeout 30
target extended-remote localhost:3333

# Load the firmware ELF into SRAM via debug module SBA
load

# Set PC to the entry point (SRAM base = 0x10000)
set $pc = 0x10000

# Set breakpoints at key locations
break main
break vTaskA
break vTaskB

# Show current state
info registers pc sp ra

# Ready to go — user types 'continue' to start execution
echo \n
echo ═══════════════════════════════════════════════════════\n
echo  PicoRV32 SoC — GDB session ready\n
echo  Firmware loaded at 0x10000, PC set to entry point.\n
echo  Breakpoints set at: main, vTaskA, vTaskB\n
echo  Type 'continue' to start execution.\n
echo ═══════════════════════════════════════════════════════\n
echo \n

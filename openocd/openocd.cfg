# ──────────────────────────────────────────────────────────────────
# OpenOCD Configuration — PicoRV32 SoC via Remote Bitbang
# ──────────────────────────────────────────────────────────────────

# ── Interface: Remote Bitbang to Verilator sim ───────────────────
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9824

# ── Transport: JTAG ──────────────────────────────────────────────
transport select jtag

# ── Reset config (sim has no SRST/TRST lines) ───────────────────
reset_config none

# ── Speed: set a reasonable adapter speed ────────────────────────
adapter speed 1000

# ── JTAG TAP ─────────────────────────────────────────────────────
jtag newtap picorv32 cpu -irlen 5 -expected-id 0x10005001

# ── Target ───────────────────────────────────────────────────────
target create picorv32.cpu riscv -chain-position picorv32.cpu

# Tell OpenOCD this is a 32-bit RISC-V (prevents 64-bit access attempts)
picorv32.cpu riscv set_mem_access sysbus

# ── Work-area: use TOP of SRAM to avoid overwriting firmware ─────
# Firmware occupies 0x10000–0x137FF; reserve 512 bytes at SRAM top
# for OpenOCD work-area algorithms.  This is ABOVE the BSS/heap.
picorv32.cpu configure -work-area-phys 0x00013E00 -work-area-size 0x0200 -work-area-backup 1

# ── GDB memory map: declare RAM region ──────────────────────────
# This tells GDB that 0x10000–0x13FFF is RAM (use software breakpoints)
picorv32.cpu configure -gdb-max-connections 1

# ── Event handlers ───────────────────────────────────────────────
# On examine: no special action needed
picorv32.cpu configure -event examine-end {
    echo "PicoRV32 examined successfully"
}

# On GDB attach: halt the CPU
picorv32.cpu configure -event gdb-attach {
    echo "GDB attached — halting CPU"
    halt
}

# Prevent OpenOCD from resetting on GDB detach
picorv32.cpu configure -event gdb-detach {
    echo "GDB detached — resuming CPU"
    resume
}

# ── Init ─────────────────────────────────────────────────────────
init
halt

# LibreLane Classic flow: top-level soc_core integration.
# References hardened PicoRV32 core macro AND OpenRAM SRAM macros.
# The MACROS block is dynamically patched by docker_asic_flow.py.
# Target: sky130A, sky130_fd_sc_hd standard cells (1.8 V).

meta:
  version: 3
  flow: Classic

DESIGN_NAME: soc_core

VERILOG_FILES:
  - dir::../rtl/asic/soc_core.sv
  - dir::../rtl/boot/boot_fsm.sv
  - dir::../rtl/boot/reset_clk.sv
  - dir::../rtl/interconnect/axi_interconnect.sv
  - dir::../rtl/interconnect/axi_interconnect_2m.sv
  - dir::../rtl/interconnect/axi2apb_bridge.sv
  - dir::../rtl/interconnect/apb_interconnect.sv
  - dir::../rtl/interconnect/irq_aggregator.sv
  - dir::../rtl/memory/sram_axi.sv
  - dir::../rtl/memory/boot_rom.sv
  - dir::../rtl/memory/icache_512b.sv
  - dir::../rtl/memory/sky130_sram_4kbyte_1rw_32x1024_8.sv
  - dir::../rtl/peripherals/uart/uart_ctrl_apb.sv
  - dir::../rtl/peripherals/uart/uart_tx.sv
  - dir::../rtl/peripherals/uart/uart_rx.sv
  - dir::../rtl/peripherals/uart/uart_fifo.sv
  - dir::../rtl/peripherals/gpio/gpio_apb.sv
  - dir::../rtl/peripherals/timer/timer_apb.sv
  - dir::../rtl/peripherals/spi/spi_master_apb.sv
  - dir::../rtl/peripherals/debug/debug_dm.sv
  - dir::../rtl/peripherals/debug/jtag_dtm.sv
  - dir::../rtl/peripherals/debug/debug_apb.sv
  - dir::../rtl/peripherals/flash/flash_ctrl.sv
  - dir::../rtl/peripherals/flash/flash_xip.sv

CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 10  # 100 MHz

# --- Timing corners (1 corner to prevent OOM during parallel RCX/STA) ---
# Full 9-corner run requires ~12+ GB RAM. Use TT nom only for P&R signoff.
# Expand corners once the flow is proven stable on this machine.
STA_CORNERS:
  - nom_tt_025C_1v80

# --- Floorplanning (professional SoC-grade) — v2 ---
# Inspired by SiFive FE310/E-class die layouts with on-chip SRAM.
# Each OpenRAM 4 KB bank is 808.845 x 351.29 um; TWO banks (8 KB) are placed in
# a single row near the TOP of the die (native orientation, no rotation). CPU is
# centered below; std-cell peripherals (incl. flash_ctrl + 1 KB I-Cache) fill the
# bottom zone. The external QSPI flash chip is OFF-die (no flash macro here).
# Die 1800x1400; utilization 45%. (MACROS/DIE_AREA are patched by
# docker_asic_flow.py:patch_top for the exact 2-bank placement.)
FP_SIZING: absolute
DIE_AREA: [0, 0, 1800, 1400]
FP_CORE_UTIL: 45
PL_TARGET_DENSITY_PCT: 60

# Macro placement halos (Handled explicitly by manual coordinates)

# --- I/O pin placement (peripheral-aware) ---
# UART/clk/reset/status -> South, JTAG/SPI -> East, Flash QSPI -> West,
# GPIO -> North (directly under the SRAM array). See soc_core_pins.cfg.
FP_PIN_ORDER_CFG: dir::soc_core_pins.cfg

# --- Power Distribution ---
PDN_HORIZONTAL_HALO: 8
PDN_VERTICAL_HALO: 8
PDN_CFG: dir::pdn_cfg.tcl   # custom grid: stdcell + macro_n (native CPU+SRAM) -> 0 PG violations

# --- Routing (sky130 met1..met5) ---
RT_MIN_LAYER: met1
RT_MAX_LAYER: met5
# GRT-0116/0230 congestion fix: 0.25 was too aggressive a track de-rate for the
# icache-dominated core. 0.15 frees ~10% more global-routing resources.
GRT_ADJUSTMENT: 0.15
GRT_OVERFLOW_ITERS: 150
# GRT-0116 safety valve: the ROOT-CAUSE fix is halving the icache FF store
# (flash_xip.sv NUM_LINES 32->16 = 512 B), which removes the met1/met2 hotspot.
# Average global-routing utilisation is only ~46%, so any residual overflow is
# LOCALIZED and is what detailed routing (TritonRoute) is designed to resolve
# with fine rip-up-and-reroute. This flag lets global routing pass that residual
# to detailed routing instead of hard-failing. It is NOT a substitute for the
# density fix — it is used together with it. See docs/SOC_TOP_WARNING_RESOLUTION.md.
GRT_ALLOW_CONGESTION: true

# --- Synthesis ---
SYNTH_STRATEGY: "DELAY 3"
# GRT-0281 high-fanout fix: bound combinational fanout so Yosys/OpenROAD build a
# buffer tree for the icache_512b req_foff[2:4] word-select nets (fanout ~0.5k-1.7k with 16 lines)
# instead of a single flat net that congests global routing. Clock/reset are
# excluded (handled by CTS).
SYNTH_MAX_FANOUT: 16

# --- Linter (Verilator) — triaged for tapeout (2026-07-09) ---
# A full `verilator --lint-only -Wall` on the elaborated design produced ONLY
# the warning classes below; each was inspected and confirmed HARMLESS, so it is
# suppressed. NO tapeout-harmful class is present or suppressed — WIDTHTRUNC
# (silent truncation), LATCH (inferred latch), MULTIDRIVEN, IMPLICIT and
# BLKANDNBLK are intentionally left ENABLED so the flow fails if one is ever
# introduced.
#   BLACKBOX stubs (picorv32_axi netlist, sky130 SRAM): UNDRIVEN/UNUSEDSIGNAL/
#     TIMESCALEMOD/PINMISSING are expected for port-only blackbox models.
#   UNUSEDSIGNAL/UNUSEDPARAM : unused status/debug taps and generic params.
#   PINCONNECTEMPTY          : intentionally-unconnected macro/peripheral outputs
#                              (trace_*, gpio_pue/ds, iof_*, fifo count).
#   DECLFILENAME             : bootrom module in boot_rom.sv (name != file).
#   WIDTHEXPAND              : icache fill_cnt(3b) == small const — no data loss.
#   CASEINCOMPLETE           : axi_interconnect r_state case is inside always_ff
#                              (clocked) -> no latch; unlisted 2-bit code just holds.
#   SYNCASYNCNET (rst_ni)    : single clock domain, reset synchronized in
#                              reset_clk.sv -> mixed sync/async use is safe.
#   EOFNEWLINE/MODDUP/MODMISSING : cosmetic / blackbox re-decl (EOFNEWLINE also
#                              fixed at source).
LINTER_DISABLE_WARNINGS_BLACKBOX: ["UNDRIVEN", "UNUSEDSIGNAL", "TIMESCALEMOD", "PINMISSING"]
LINTER_DISABLE_WARNINGS: ["DECLFILENAME", "EOFNEWLINE", "MODDUP", "MODMISSING", "PINCONNECTEMPTY", "WIDTHEXPAND", "UNUSEDPARAM", "UNUSEDSIGNAL", "CASEINCOMPLETE", "SYNCASYNCNET"]

# --- Synthesis checks ---
# picorv32_axi (1 macro) + sky130_sram (2 macros) = 3 blackbox instances
# that Yosys counts as "check errors" even though they're valid hardened macros.
# (The external QSPI flash is off-die; flash_ctrl/flash_xip/icache_512b are std cells.)
ERROR_ON_SYNTH_CHECKS: false

# --- Hierarchical signoff: BLACKBOX handling for the verified hard macros --------
# DRC: keep GDS mode (MAGIC_DRC_USE_GDS default=true). Magic then sees the SRAM's
#   REAL internal geometry (incl. its N+ well taps) and the OpenRAM SRAM is
#   Magic-DRC-clean -> chip Magic DRC = 0. (Do NOT set MAGIC_DRC_USE_GDS=false:
#   abstract DRC sees the SRAM LEF well but not its internal taps, producing ~1500
#   FALSE 'nwell.4: nwells must contain metal-connected N+ taps' errors.)
# LVS: use ABSTRACT extraction so the SRAM/CPU are blackboxed and compared by PINS
#   (not re-extracted transistors) -> avoids the 25k-device extraction (memory) and
#   the internal-device mismatch. Combined with USE_POWER_PINS for the pin match.
MAGIC_EXT_USE_GDS: false
MAGIC_EXT_ABSTRACT: false  # DEVICE/cell extraction so top vccd1/vssd1 PORTS are emitted
                           # (abstract=true dropped them -> LVS "top pin matching failed").
                           # SRAM stays a blackbox (LEF-only) so no flatten/OOM; magic-DRC
                           # (the real OOM) is disabled below.

# --- KLayout DRC: SRAM-waived deck (the efabless/OpenRAM signoff deck) -----------
# The stock sky130A_mr.drc flags ~2067 nwell/nsdm/psdm "violations" INSIDE the
# OpenRAM SRAM bitcells — a known foundry-cell artifact (Magic accepts them; the
# SRAM is silicon-proven). This waived deck is identical to the standard one for
# ALL rules on the whole chip, EXCEPT it excludes the SRAM cells
# (select "-*sky130_sram_*kbyte_*") from the nwell/nsdm/psdm rules (SRAM_EXCLUDE,
# default true). Every other rule (metal m1-m5, via-via4, poly, licon, ...) is
# still checked everywhere, including on the SRAM. Result: KLayout DRC = 0 with
# NO real error hidden. This is the same deck used for the SRAM's standalone
# KLayout signoff (openram/drc_signoff/).
KLAYOUT_DRC_RUNSET: dir::sky130A_mr_sram_waived.drc

# --- Magic DRC DISABLED (memory) — KLayout is the DRC signoff --------------------
# Magic DRC runs in GDS mode (correct: sees the SRAM's real N+ taps -> 0 errors),
# but that flattens the two 32 MB OpenRAM SRAM bitcell GDSes, which exceeds the
# 14 GB Docker VM (already at the 15 GB host ceiling) -> repeated OOM/daemon crash.
# Abstract Magic DRC would fit but wrongly fires ~1500 nwell.4 (abstract lacks the
# SRAM's internal taps). Resolution: DRC signoff via the KLayout `sky130A_mr`
# (SRAM-waived) deck above — a COMPLETE foundry deck, validated on this GDS to give
# 0 (2064 SRAM well/implant waived, all else checked), using only ~1.7 GB. The
# SRAM & CPU macros are Magic-DRC-verified STANDALONE, so their internals are not
# re-checked at the chip level. This makes the whole flow memory-safe (no SRAM
# flatten anywhere: KLayout deck is light, LVS uses abstract extraction).
RUN_MAGIC_DRC: false

# --- Power pins in the netlist (LVS pin match for the SRAM macro) ---
# Elaborate the `ifdef USE_POWER_PINS vccd1/vssd1 endif` guards in soc_core.sv,
# sram_axi.sv and the SRAM blackbox so the SYNTHESIZED netlist carries the SRAM
# macro's power connectivity (vccd1/vssd1). Without this the SRAM power pins float
# in the netlist while the PDN ties them in the layout -> the netgen LVS
# vccd1/vssd1 pin mismatch. (The CPU macro stays a blackbox; its power is not
# netlist-compared.)
VERILOG_POWER_DEFINE: USE_POWER_PINS   # correct LibreLane var (default is already this); powers the pnl.v netlist for LVS

# --- Clock Tree Synthesis ---
CTS_APPLY_NDR: none

# --- Post-route timing repair (fix for the -1.6 ns SoC setup at 100 MHz) ---
# The CPU<->SRAM AXI datapath was setup-violating (-1.6 ns) with 2348 max-slew +
# 140 max-cap violations because post-GLOBAL-ROUTE optimization was OFF, so the
# long inter-macro nets were never re-buffered with routed parasitics. Enabling
# post-GRT design-repair (fixes slew/cap by buffering) and resizer timing (setup
# repair via buffering/upsizing) recovers the slew-limited delay on those paths.
RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true

# --- Macro blackbox stubs for Yosys (needed before MACROS block is applied) ---
# picorv32_axi hardened netlist — gives Yosys a port declaration so it doesn't
# error with "Module not part of design" during jsonheader / synthesis steps.
EXTRA_VERILOG_MODELS:
  - dir::../build/picorv32_axi/nl/picorv32_axi.nl.v

# --- LVS: blackbox the SRAM (no SPICE netlist for behavioral macro) ---
# NOTE: Do NOT set LVS_FLATTEN_CELLS for the SRAM. The layout side extracts the
# SRAM as an *empty* abstract blackbox subckt (MAGIC_EXT_USE_GDS=false); asking
# netgen to `flatten class` an empty blackbox DISSOLVES its 2 instances in the
# layout circuit only (netlist keeps them) -> a spurious 2-device/2-net delta
# that cascades into "Top level cell failed pin matching" on vccd1/vssd1.
# With the flatten removed, netgen's `-blackbox` matches the SRAM as a black box
# on both sides -> "Circuits match uniquely". Verified standalone against the
# extracted soc_core.spice + soc_core.pnl.v (see docs/LVS_OPEN_ISSUE_HANDOFF.md).
# LVS_FLATTEN_CELLS:
#   - sky130_sram_4kbyte_1rw_32x1024_8

# SRAM banks are blackboxed macros — signal connectivity checked at RTL level
IGNORE_DISCONNECTED_MODULES:
  - sky130_sram_4kbyte_1rw_32x1024_8

# --- SDC ---
PNR_SDC_FILE: dir::soc_core.sdc
SIGNOFF_SDC_FILE: dir::soc_core.sdc

# ============================================================
# MACROS and PDN_MACRO_CONNECTIONS are dynamically patched by
# docker_asic_flow.py (Step 4: patch_top). See that script for
# the per-corner Liberty mapping and instance placement.
# ============================================================

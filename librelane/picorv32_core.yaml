# LibreLane Classic flow — standalone hardening of the PicoRV32 core macro.
# Produces GDS/LEF/Liberty/Verilog views consumed by soc_core_top.yaml.
#
# Baseline mirrors the canonical OpenLane `picorv32a` reference config
# (FP_CORE_UTIL 35, PL_TARGET_DENSITY 0.5, default sky130 met1..met5 routing).
# PicoRV32 is a well-proven core that hardens cleanly with these standard
# settings — so this config keeps to defaults and changes only what is needed.
#
# Target: sky130A, sky130_fd_sc_hd standard cells (1.8 V).

meta:
  version: 3
  flow: Classic

DESIGN_NAME: picorv32_axi

VERILOG_FILES:
  - dir::../rtl/core/picorv32.sv
  - dir::../rtl/core/picorv32_axi.sv
  - dir::../rtl/core/picorv32_axi_adapter.sv
  - dir::../rtl/core/picorv32_pcpi.sv

# --- Clock ---
CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 10  # 100 MHz target

# --- Floorplanning (canonical picorv32a values) ---
FP_SIZING: relative
FP_CORE_UTIL: 35
PL_TARGET_DENSITY_PCT: 50

# --- Synthesis ---
# DELAY-optimized: the peer-reviewed sky130 timing-closure study (preprints.org
# 2026) found PicoRV32 closes ~200 MHz on sky130 and that DELAY strategies
# dominate the timing-closed configurations. At the 100 MHz target this is the
# key lever for shrinking the regfile->ALU->regfile datapath (the same regfile
# read mux that feeds the debug interface).
SYNTH_STRATEGY: "DELAY 0"

# --- Linter (suppress TIMESCALEMOD from PDK blackbox stubs) ---
LINTER_DISABLE_WARNINGS_BLACKBOX: ["UNDRIVEN", "UNUSEDSIGNAL", "TIMESCALEMOD", "PINMISSING"]

# --- Routing ---
# 100 MHz TARGET: signal routing uses the full met1..met5 stack. met5 is needed
# to shorten the regfile/ALU datapath nets (the met4-only cap added ~3 ns and is
# incompatible with 100 MHz). NOTE: this reintroduces the possibility of macro
# met5 signal wires under the SoC-top met5 PDN straps — handled at the top level
# by the macro halo; if a met5 short appears in top detailed routing, add a
# top-level met5 routing blockage over the macro (does not require re-hardening).
RT_MIN_LAYER: met1
RT_MAX_LAYER: met5

# --- Power Distribution (macro hardening) — PSM-0069 ROOT-CAUSE FIX ------------
# POWER still tops at met4 (met1 rails + met4 straps, PDN_MULTILAYER=false). This
# is the actual PSM-0069 fix: the macro's power PINS are on met4, so the SoC-top
# met5 power straps via ORTHOGONALLY down onto them (met5 power pins would run
# parallel to the top met5 straps and could not connect → the floating vccd1
# island / 833 violations). Signal routing on met5 (above) is independent of the
# power grid and does not re-create the PSM-0069 power-connectivity failure.
PDN_MULTILAYER: false         # met1 rails + met4 vertical straps only (no met5 POWER)
PDN_VERTICAL_LAYER: met4      # vertical straps + promoted power pins (macro top)

# --- Clock Tree Synthesis ---
# DRT-0073 ROOT CAUSE & FIX:
# The default CTS_APPLY_NDR="half" applies a 2X-spacing non-default rule to
# clock nets. On a dense core like PicoRV32 (~2.3k flops + hold buffers) that
# doubled clock-wire spacing leaves the detailed router unable to form a legal
# access point to the clkbuf input (A) pins → "DRT-0073 No access point for
# clkbuf_*/A" on every clock buffer. A sparse design (e.g. the spm example)
# has room to absorb the NDR, which is why it routes fine and this did not.
# Disabling the clock NDR removes the spacing that blocks clkbuf pin access.
CTS_APPLY_NDR: none

# --- SDC ---
PNR_SDC_FILE: dir::soc_core.sdc
SIGNOFF_SDC_FILE: dir::soc_core.sdc

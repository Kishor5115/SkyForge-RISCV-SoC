# LibreLane Classic flow — standalone hardening of the PicoRV32 core macro.
# Produces GDS/LEF/Liberty/Verilog views consumed by soc_core_top.yaml.
#
# Baseline mirrors the canonical OpenLane `picorv32a` reference config
# (FP_CORE_UTIL 35, PL_TARGET_DENSITY 0.5, default sky130 met1..met5 routing).
# PicoRV32 is a well-proven core that hardens cleanly with these standard
# settings — so this config keeps to defaults and changes only what is needed.
#
# Target: sky130A, sky130_fd_sc_hd standard cells (1.8 V).

meta:
  version: 3
  flow: Classic

DESIGN_NAME: picorv32_axi

VERILOG_FILES:
  - dir::../rtl/core/picorv32.sv
  - dir::../rtl/core/picorv32_axi.sv
  - dir::../rtl/core/picorv32_axi_adapter.sv
  - dir::../rtl/core/picorv32_pcpi.sv

# --- Clock ---
CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 20  # 50 MHz target

# --- Floorplanning (canonical picorv32a values) ---
FP_SIZING: relative
FP_CORE_UTIL: 35
PL_TARGET_DENSITY_PCT: 50

# --- Synthesis ---
SYNTH_STRATEGY: "AREA 0"

# --- Linter (suppress TIMESCALEMOD from PDK blackbox stubs) ---
LINTER_DISABLE_WARNINGS_BLACKBOX: ["UNDRIVEN", "UNUSEDSIGNAL", "TIMESCALEMOD", "PINMISSING"]

# --- Routing ---
# Use the sky130A PDK defaults (RT_MIN_LAYER met1, RT_MAX_LAYER met5).
# li1 is local-interconnect only; the router reaches li1 cell pins through the
# licon/mcon via stack automatically. (Do NOT force routing onto li1.)

# --- Clock Tree Synthesis ---
# DRT-0073 ROOT CAUSE & FIX:
# The default CTS_APPLY_NDR="half" applies a 2X-spacing non-default rule to
# clock nets. On a dense core like PicoRV32 (~2.3k flops + hold buffers) that
# doubled clock-wire spacing leaves the detailed router unable to form a legal
# access point to the clkbuf input (A) pins → "DRT-0073 No access point for
# clkbuf_*/A" on every clock buffer. A sparse design (e.g. the spm example)
# has room to absorb the NDR, which is why it routes fine and this did not.
# Disabling the clock NDR removes the spacing that blocks clkbuf pin access.
CTS_APPLY_NDR: none

# --- SDC ---
PNR_SDC_FILE: dir::soc_core.sdc
SIGNOFF_SDC_FILE: dir::soc_core.sdc

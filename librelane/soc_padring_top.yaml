meta:
  version: 3
  flow: Classic

DESIGN_NAME: soc_padring

# soc_padring.sv instantiates sky130_ef_io pads + hardened soc_core
VERILOG_FILES:
- dir::../rtl/asic/soc_padring.sv

# pad cells Verilog models (blackbox) for synthesis
EXTRA_VERILOG_MODELS:
- /foss/pdks/sky130A/libs.ref/sky130_fd_io/verilog/sky130_fd_io__blackbox.v
- /foss/pdks/sky130A/libs.ref/sky130_fd_io/verilog/sky130_ef_io.v
# hardened soc_core netlist
- /foss/designs/riscv_soc/workspace/build/soc_core/nl/soc_core.nl.v

CLOCK_PORT: pad_clk
CLOCK_NET:  pad_clk
CLOCK_PERIOD: 20

STA_CORNERS:
- nom_tt_025C_1v80

# ---- Die ---------------------------------------------------------------
# Chip die = soc_core (2533x1825) + pad ring depth 211um + 20um margin + 200um corners
# E/W: 48 pads x 80um = 3840um → CHIP_H = 3840 + 2*200 = 4240
# S:   20 pads x 80um = 1600um → CHIP_W = 3000 (>= 1600+2*200=2000, also > 2533+2*251=3035 → 3060)
FP_SIZING: absolute
DIE_AREA: [0, 0, 3060, 4240]

FP_CORE_UTIL: 1         # placement done manually (pad cells + 1 hard macro)
PL_TARGET_DENSITY_PCT: 5
FP_PIN_ORDER_CFG: dir::soc_padring_pins.cfg

# ---- Pad-ring layer strategy -------------------------------------------
RT_MIN_LAYER: met1
RT_MAX_LAYER: met5

GRT_ADJUSTMENT: 0.10
GRT_OVERFLOW_ITERS: 100

# ---- Linting / synthesis flags -----------------------------------------
LINTER_DISABLE_WARNINGS_BLACKBOX:
- UNDRIVEN
- UNUSEDSIGNAL
- TIMESCALEMOD
- PINMISSING

LINTER_DISABLE_WARNINGS:
- DECLFILENAME
- EOFNEWLINE
- MODDUP
- MODMISSING
- PINCONNECTEMPTY

ERROR_ON_SYNTH_CHECKS: false
CTS_APPLY_NDR: none

# ---- Ignore disconnected blackbox modules ------------------------------
IGNORE_DISCONNECTED_MODULES:
- sky130_ef_io__gpiov2_pad_wrapped
- sky130_ef_io__vccd_lvc_pad
- sky130_ef_io__vssd_lvc_pad
- sky130_ef_io__vddio_hvc_pad
- sky130_ef_io__vssio_hvc_pad
- sky130_ef_io__corner_pad
- soc_core

LVS_FLATTEN_CELLS:
- sky130_sram_4kbyte_1rw_32x1024_8
- soc_core

# ---- SDC ---------------------------------------------------------------
PNR_SDC_FILE: dir::soc_core.sdc
SIGNOFF_SDC_FILE: dir::soc_core.sdc

# ---- VDD/GND -----------------------------------------------------------
VDD_NETS:
- vccd1
- vddio
GND_NETS:
- vssd1
- vssio

PDN_CONNECT_MACROS_TO_GRID: false   # pad ring has its own power structure
PDN_CFG: dir::pdn_cfg.tcl

# ---- MACROS ------------------------------------------------------------
MACROS:
  # ---- Hardened soc_core (center of chip) ------------------------------
  soc_core:
    gds:
    - /foss/designs/riscv_soc/workspace/build/soc_core/gds/soc_core.gds
    lef:
    - /foss/designs/riscv_soc/workspace/build/soc_core/lef/soc_core.lef
    vh:
    - /foss/designs/riscv_soc/workspace/build/soc_core/nl/soc_core.nl.v
    lib:
      nom_tt_025C_1v80:
      - /foss/designs/riscv_soc/workspace/build/soc_core/lib/nom_tt_025C_1v80/soc_core__nom_tt_025C_1v80.lib
    instances:
      u_soc_core:
        location: [263, 431]   # centred: (3060-2533)/2=263, CORNER+PAD_DEPTH+MARGIN=200+211+20=431
        orientation: N

  # ---- sky130_ef_io pad cells (LEF+GDS from PDK) -----------------------
  sky130_ef_io__gpiov2_pad_wrapped:
    gds:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/gds/sky130_ef_io.gds
    lef:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lef/sky130_ef_io.lef
    lib:
      nom_tt_025C_1v80:
      - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lib/sky130_ef_io__gpiov2_pad_wrapped_tt_tt_025C_1v80_3v30.lib
    instances: {}   # all instances placed by soc_padring_pins.cfg / manual DEF

  sky130_ef_io__corner_pad:
    gds:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/gds/sky130_ef_io.gds
    lef:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lef/sky130_ef_io.lef
    lib:
      nom_tt_025C_1v80:
      - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lib/sky130_ef_io__gpiov2_pad_wrapped_tt_tt_025C_1v80_3v30.lib
    instances:
      u_corner_sw: {location: [0,    0],    orientation: N}
      u_corner_se: {location: [2860, 0],    orientation: E}
      u_corner_ne: {location: [2860, 4036], orientation: S}
      u_corner_nw: {location: [0,    4036], orientation: W}

  sky130_ef_io__vccd_lvc_pad:
    gds:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/gds/sky130_ef_io.gds
    lef:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lef/sky130_ef_io.lef
    lib:
      nom_tt_025C_1v80:
      - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lib/sky130_ef_io__gpiov2_pad_wrapped_tt_tt_025C_1v80_3v30.lib
    instances:
      u_vccd1_n0: {location: [505,  4036], orientation: S}
      u_vccd1_n1: {location: [1435, 4036], orientation: S}

  sky130_ef_io__vssd_lvc_pad:
    gds:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/gds/sky130_ef_io.gds
    lef:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lef/sky130_ef_io.lef
    lib:
      nom_tt_025C_1v80:
      - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lib/sky130_ef_io__gpiov2_pad_wrapped_tt_tt_025C_1v80_3v30.lib
    instances:
      u_vssd1_n0: {location: [890,  4036], orientation: S}
      u_vssd1_n1: {location: [1820, 4036], orientation: S}

  sky130_ef_io__vddio_hvc_pad:
    gds:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/gds/sky130_ef_io.gds
    lef:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lef/sky130_ef_io.lef
    lib:
      nom_tt_025C_1v80:
      - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lib/sky130_ef_io__gpiov2_pad_wrapped_tt_tt_025C_1v80_3v30.lib
    instances:
      u_vddio_s0: {location: [505,  0], orientation: N}
      u_vddio_s1: {location: [1435, 0], orientation: N}

  sky130_ef_io__vssio_hvc_pad:
    gds:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/gds/sky130_ef_io.gds
    lef:
    - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lef/sky130_ef_io.lef
    lib:
      nom_tt_025C_1v80:
      - /foss/pdks/sky130A/libs.ref/sky130_fd_io/lib/sky130_ef_io__gpiov2_pad_wrapped_tt_tt_025C_1v80_3v30.lib
    instances:
      u_vssio_s0: {location: [890,  0], orientation: N}
      u_vssio_s1: {location: [1820, 0], orientation: N}

PDN_MACRO_CONNECTIONS:
- .*u_soc_core.* vccd1 vssd1 vccd1 vssd1
